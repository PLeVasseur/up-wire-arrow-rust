[package]
name = "up-wire-arrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Apache Arrow IPC selected-wire payload codec for Eclipse uProtocol"
readme = "README.md"

[dependencies]
arrow-array = { version = "58.0.0", default-features = false }
arrow-ipc = { version = "58.0.0", default-features = false }
arrow-schema = { version = "58.0.0", default-features = false }
bytes = { version = "1.11.1", default-features = false }
up-rust = { version = "=0.10.0-SNAPSHOT", git = "https://github.com/PLeVasseur/up-rust.git", rev = "d7f50d06ecdbd3f6631745e2514727bc422498a2", default-features = false, features = ["selected-wire-user-api", "wire-implementer-api"] }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }

[[bench]]
name = "wire_criterion"
harness = false

[lints.rust]
unsafe_code = "forbid"
